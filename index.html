<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Изучение английских слов</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --text: #1a1a1a;
            --primary: #4a90e2;
            --success: #2ecc71;
            --error: #e74c3c;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h1, h2 { text-align: center; margin-top: 0; }
        .hidden { display: none !important; }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            background-color: var(--primary);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover { background-color: #357abd; }
        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        .btn-outline:hover { background: var(--primary); color: white; }
        input[type="text"] {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: var(--primary);
            outline: none;
        }
        .word-display {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
            color: var(--primary);
        }
        .feedback { text-align: center; font-weight: bold; margin: 15px 0; height: 20px; }
        .feedback.success { color: var(--success); }
        .feedback.error { color: var(--error); }
        .progress { text-align: center; color: #777; margin-bottom: 15px; }
        .results-list { text-align: left; max-height: 300px; overflow-y: auto; margin-bottom: 20px;}
        .result-item {
            background: #f9f9f9;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            border-left: 4px solid var(--error);
        }
        .result-item .correct { color: var(--success); font-weight: bold; }
        .result-item .yours { color: var(--error); text-decoration: line-through; }
    </style>
</head>
<body>

<div class="container">
    <div id="start-screen">
        <h1>Тренажер слов</h1>
        <p style="text-align: center; color: #666;">Выберите режим для начала</p>
        <button class="btn" onclick="startGame('ru-en')">Русский ➔ Английский</button>
        <button class="btn" onclick="startGame('en-ru')">Английский ➔ Русский</button>
    </div>

    <div id="game-screen" class="hidden">
        <div class="progress" id="progress"></div>
        <div class="word-display" id="question-text"></div>
        <input type="text" id="answer-input" placeholder="Введите перевод..." autocomplete="off">
        <button class="btn" onclick="checkAnswer()">Проверить</button>
        <div class="feedback" id="feedback"></div>
    </div>

    <div id="result-screen" class="hidden">
        <h2>Результаты</h2>
        <div class="word-display" id="score-text"></div>
        <div class="results-list" id="mistakes-list"></div>
        <button class="btn" onclick="location.reload()">Пройти заново</button>
    </div>
</div>

<script>
    const dictionary = [
        { en: "author", ru: "автор либо писатель" },
        { en: "traffic warden", ru: "регулировщик дорожного движения" },
        { en: "vet", ru: "ветеринар" },
        { en: "artist", ru: "художник, артист" },
        { en: "lion tamer", ru: "дрессировщик, укротитель львов" },
        { en: "operator", ru: "оператор, телефонист" },
        { en: "waiter", ru: "официант" },
        { en: "air traffic warden", ru: "авиационный диспетчер" },
        { en: "architect", ru: "архитектор" },
        { en: "graphic designer", ru: "художник-оформитель" },
        { en: "accountant", ru: "бухгалтер" },
        { en: "cashier", ru: "кассир" },
        { en: "computer programmer", ru: "программист" },
        { en: "pizza delivery boy", ru: "разносчик пиццы" },
        { en: "car salesman", ru: "продавец автомобилей" },
        { en: "sales assistant", ru: "продавец" },
        { en: "bank teller", ru: "кассир в банке" },
        { en: "freelancer", ru: "фрилансер" },
        { en: "desk", ru: "стол, парта" },
        { en: "uniform", ru: "униформа" },
        { en: "full-time", ru: "полный рабочий день, полная занятость" },
        { en: "overtime", ru: "переработка, сверхурочные" },
        { en: "shift", ru: "смена" },
        { en: "salary", ru: "зарплата" },
        { en: "deadlines", ru: "крайний срок, срок исполнения" },
        { en: "pay rise", ru: "повышение зарплаты, повышение оплаты" },
        { en: "part-time", ru: "неполная занятость, полный рабочий день" }
    ];

    let currentMode = '';
    let questions = [];
    let currentIndex = 0;
    let score = 0;
    let mistakes = [];

    // Очистка текста от регистра, знаков препинания и сортировка слов
    function normalize(text) {
        return text.toLowerCase()
                   .replace(/[^\w\sа-яё]/g, ' ') // Оставляем только буквы и пробелы
                   .split(/\s+/)                 // Разделяем на слова
                   .filter(w => w.length > 0)    // Убираем пустые элементы
                   .sort()                       // Сортируем (для "стол парта" = "парта стол")
                   .filter((v, i, a) => a.indexOf(v) === i) // Убираем дубликаты
                   .join(' ');
    }

    // Генерация всех правильных вариантов для русского слова
    function getValidRussianAnswers(ruText) {
        let cleanRu = ruText.replace(/\s+либо\s+/g, ', ').replace(/\s+или\s+/g, ', ');
        let parts = cleanRu.split(',').map(p => p.trim());
        let valid = new Set();
        
        parts.forEach(p => valid.add(normalize(p)));
        if (parts.length > 1) {
            valid.add(normalize(parts.join(' ')));
        }
        return Array.from(valid);
    }

    function startGame(mode) {
        currentMode = mode;
        questions = [...dictionary].sort(() => Math.random() - 0.5); // Перемешать
        currentIndex = 0;
        score = 0;
        mistakes = [];

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        loadQuestion();
    }

    function loadQuestion() {
        if (currentIndex >= questions.length) {
            showResults();
            return;
        }

        document.getElementById('feedback').textContent = '';
        document.getElementById('answer-input').value = '';
        document.getElementById('answer-input').focus();
        document.getElementById('progress').textContent = `Вопрос ${currentIndex + 1} из ${questions.length}`;

        const q = questions[currentIndex];
        if (currentMode === 'ru-en') {
            const displayRu = q.ru.replace(/\s+либо\s+/g, ' / ');
            document.getElementById('question-text').textContent = displayRu;
        } else {
            document.getElementById('question-text').textContent = q.en;
        }
    }

    function checkAnswer() {
        const input = document.getElementById('answer-input');
        const userAnswer = input.value.trim();
        if (!userAnswer) return;

        const q = questions[currentIndex];
        const normUser = normalize(userAnswer);
        let isCorrect = false;
        let correctDisplay = '';

        if (currentMode === 'ru-en') {
            isCorrect = (normUser === normalize(q.en));
            correctDisplay = q.en;
        } else {
            const validAnswers = getValidRussianAnswers(q.ru);
            isCorrect = validAnswers.includes(normUser);
            correctDisplay = q.ru;
        }

        const feedbackEl = document.getElementById('feedback');

        if (isCorrect) {
            score++;
            feedbackEl.textContent = 'Верно!';
            feedbackEl.className = 'feedback success';
        } else {
            feedbackEl.textContent = `Ошибка! Правильно: ${correctDisplay}`;
            feedbackEl.className = 'feedback error';
            mistakes.push({
                question: currentMode === 'ru-en' ? q.ru : q.en,
                correct: correctDisplay,
                yours: userAnswer
            });
        }

        currentIndex++;
        
        // Задержка перед следующим вопросом, чтобы успеть увидеть ответ
        setTimeout(() => {
            loadQuestion();
        }, 1500);
    }

    // Обработка нажатия Enter
    document.getElementById('answer-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            if (document.getElementById('feedback').textContent === '') {
                checkAnswer();
            }
        }
    });

    function showResults() {
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        
        document.getElementById('score-text').textContent = `${score} из ${questions.length}`;
        
        const listEl = document.getElementById('mistakes-list');
        listEl.innerHTML = '';
        
        if (mistakes.length > 0) {
            const title = document.createElement('p');
            title.textContent = 'Ваши ошибки:';
            title.style.fontWeight = 'bold';
            title.style.marginBottom = '10px';
            listEl.appendChild(title);

            mistakes.forEach(m => {
                const div = document.createElement('div');
                div.className = 'result-item';
                div.innerHTML = `
                    <div>Слово: <b>${m.question}</b></div>
                    <div>Вы ввели: <span class="yours">${m.yours}</span></div>
                    <div>Правильно: <span class="correct">${m.correct}</span></div>
                `;
                listEl.appendChild(div);
            });
        } else {
            listEl.innerHTML = '<p style="text-align:center; color: #2ecc71; font-weight: bold;">Идеальный результат! Ошибок нет.</p>';
        }
    }
</script>
</body>
</html>
