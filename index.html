<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Изучение английских слов</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --text: #1a1a1a;
            --text-muted: #666666;
            --primary: #4a90e2;
            --primary-hover: #357abd;
            --success: #2ecc71;
            --error: #e74c3c;
            --input-border: #dddddd;
            --result-bg: #f9f9f9;
        }

        /* Темная тема */
        body.dark {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #e0e0e0;
            --text-muted: #aaaaaa;
            --primary: #64b5f6;
            --primary-hover: #42a5f5;
            --success: #81c784;
            --error: #e57373;
            --input-border: #444444;
            --result-bg: #2d2d2d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            position: relative;
            transition: background-color 0.3s;
        }

        /* Кнопка переключения темы */
        .theme-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
            line-height: 1;
            transition: transform 0.3s;
        }
        .theme-toggle:hover { transform: scale(1.1); }

        h1, h2 { text-align: center; margin-top: 0; }
        .hidden { display: none !important; }
        
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            background-color: var(--primary);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            box-sizing: border-box;
        }
        .btn:hover { background-color: var(--primary-hover); }
        
        .btn-share { background-color: var(--success); margin-top: 20px; }
        .btn-share:hover { background-color: #27ae60; }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid var(--input-border);
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: transparent;
            color: var(--text);
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: var(--primary);
            outline: none;
        }

        .word-display {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
            color: var(--primary);
        }

        .feedback { text-align: center; font-weight: bold; margin: 15px 0; height: 20px; }
        .feedback.success { color: var(--success); }
        .feedback.error { color: var(--error); }
        .progress { text-align: center; color: var(--text-muted); margin-bottom: 15px; }
        
        .results-list { text-align: left; max-height: 250px; overflow-y: auto; margin-bottom: 10px;}
        .result-item {
            background: var(--result-bg);
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            border-left: 4px solid var(--error);
        }
        .result-item .correct { color: var(--success); font-weight: bold; }
        .result-item .yours { color: var(--error); text-decoration: line-through; }

        /* Стили для модального окна "Поделиться" (для ПК) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-content {
            background: var(--card-bg); padding: 25px; border-radius: 12px;
            width: 90%; max-width: 320px; text-align: center;
            transform: translateY(20px); transition: transform 0.3s;
            color: var(--text);
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .social-btns { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .social-btn {
            padding: 12px; border-radius: 8px; text-decoration: none;
            color: white !important; font-weight: bold; display: flex; align-items: center; justify-content: center;
            font-size: 15px; border: none; cursor: pointer; transition: 0.2s;
        }
        .social-btn:hover { opacity: 0.9; }
        .tg { background: #0088cc; }
        .wa { background: #25D366; }
        .vk { background: #4C75A3; }
        .copy { background: #333; }
        .close-modal { background: var(--input-border); color: var(--text) !important; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Сменить тему">🌙</button>

    <div id="start-screen">
        <h1>Тренажер слов</h1>
        <p style="text-align: center; color: var(--text-muted);">Выберите режим для начала</p>
        <button class="btn" onclick="startGame('ru-en')">Русский ➔ Английский</button>
        <button class="btn" onclick="startGame('en-ru')">Английский ➔ Русский</button>
    </div>

    <div id="game-screen" class="hidden">
        <div class="progress" id="progress"></div>
        <div class="word-display" id="question-text"></div>
        <input type="text" id="answer-input" placeholder="Введите перевод..." autocomplete="off">
        <button class="btn" onclick="checkAnswer()">Проверить</button>
        <div class="feedback" id="feedback"></div>
    </div>

    <div id="result-screen" class="hidden">
        <h2>Результаты</h2>
        <div class="word-display" id="score-text"></div>
        
        <button class="btn btn-share" onclick="shareResult()">📤 Поделиться результатом</button>

        <div class="results-list" id="mistakes-list"></div>
        <button class="btn" onclick="location.reload()">Пройти заново</button>
    </div>
</div>

<!-- Модальное окно для ПК -->
<div class="modal-overlay" id="share-modal">
    <div class="modal-content">
        <h3 style="margin-top:0;">Поделиться результатом</h3>
        <p style="font-size: 14px; color:var(--text-muted);">Отправьте друзьям свой результат!</p>
        <div class="social-btns">
            <a href="#" class="social-btn tg" id="share-tg" target="_blank">Telegram</a>
            <a href="#" class="social-btn wa" id="share-wa" target="_blank">WhatsApp</a>
            <a href="#" class="social-btn vk" id="share-vk" target="_blank">ВКонтакте</a>
            <button class="social-btn copy" id="share-copy" onclick="copyToClipboard()">Скопировать текст</button>
            <button class="social-btn close-modal" onclick="closeModal()">Отмена</button>
        </div>
    </div>
</div>

<script>
    // --- ЛОГИКА ТЕМНОЙ ТЕМЫ ---
    const themeToggleBtn = document.getElementById('theme-toggle');
    
    // Проверяем сохраненную тему или системные настройки
    if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.body.classList.add('dark');
        themeToggleBtn.textContent = '☀️';
    }

    function toggleTheme() {
        document.body.classList.toggle('dark');
        if (document.body.classList.contains('dark')) {
            localStorage.setItem('theme', 'dark');
            themeToggleBtn.textContent = '☀️';
        } else {
            localStorage.setItem('theme', 'light');
            themeToggleBtn.textContent = '🌙';
        }
    }

    // --- ЛОГИКА ИГРЫ ---
    const dictionary = [
        { en: "author", ru: "автор либо писатель" },
        { en: "traffic warden", ru: "регулировщик дорожного движения" },
        { en: "vet", ru: "ветеринар" },
        { en: "artist", ru: "художник, артист" },
        { en: "lion tamer", ru: "дрессировщик, укротитель львов" },
        { en: "operator", ru: "оператор, телефонист" },
        { en: "waiter", ru: "официант" },
        { en: "air traffic warden", ru: "авиационный диспетчер" },
        { en: "architect", ru: "архитектор" },
        { en: "graphic designer", ru: "художник-оформитель" },
        { en: "accountant", ru: "бухгалтер" },
        { en: "cashier", ru: "кассир" },
        { en: "computer programmer", ru: "программист" },
        { en: "pizza delivery boy", ru: "разносчик пиццы" },
        { en: "car salesman", ru: "продавец автомобилей" },
        { en: "sales assistant", ru: "продавец" },
        { en: "bank teller", ru: "кассир в банке" },
        { en: "freelancer", ru: "фрилансер" },
        { en: "desk", ru: "стол, парта" },
        { en: "uniform", ru: "униформа" },
        { en: "full-time", ru: "полный рабочий день, полная занятость" },
        { en: "overtime", ru: "переработка, сверхурочные" },
        { en: "shift", ru: "смена" },
        { en: "salary", ru: "зарплата" },
        { en: "deadlines", ru: "крайний срок, срок исполнения" },
        { en: "pay rise", ru: "повышение зарплаты, повышение оплаты" },
        { en: "part-time", ru: "неполная занятость, полный рабочий день" }
    ];

    let currentMode = '';
    let questions = [];
    let currentIndex = 0;
    let score = 0;
    let mistakes = [];

    function normalize(text) {
        return text.toLowerCase()
                   .replace(/[^\w\sа-яё]/g, ' ') 
                   .split(/\s+/)                 
                   .filter(w => w.length > 0)    
                   .sort()                       
                   .filter((v, i, a) => a.indexOf(v) === i) 
                   .join(' ');
    }

    function getValidRussianAnswers(ruText) {
        let cleanRu = ruText.replace(/\s+либо\s+/g, ', ').replace(/\s+или\s+/g, ', ');
        let parts = cleanRu.split(',').map(p => p.trim());
        let valid = new Set();
        parts.forEach(p => valid.add(normalize(p)));
        if (parts.length > 1) valid.add(normalize(parts.join(' ')));
        return Array.from(valid);
    }

    function startGame(mode) {
        currentMode = mode;
        questions = [...dictionary].sort(() => Math.random() - 0.5);
        currentIndex = 0;
        score = 0;
        mistakes = [];

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        loadQuestion();
    }

    function loadQuestion() {
        if (currentIndex >= questions.length) {
            showResults();
            return;
        }

        document.getElementById('feedback').textContent = '';
        document.getElementById('answer-input').value = '';
        document.getElementById('answer-input').focus();
        document.getElementById('progress').textContent = `Вопрос ${currentIndex + 1} из ${questions.length}`;

        const q = questions[currentIndex];
        if (currentMode === 'ru-en') {
            const displayRu = q.ru.replace(/\s+либо\s+/g, ' / ');
            document.getElementById('question-text').textContent = displayRu;
        } else {
            document.getElementById('question-text').textContent = q.en;
        }
    }

    function checkAnswer() {
        const input = document.getElementById('answer-input');
        const userAnswer = input.value.trim();
        if (!userAnswer) return;

        const q = questions[currentIndex];
        const normUser = normalize(userAnswer);
        let isCorrect = false;
        let correctDisplay = '';

        if (currentMode === 'ru-en') {
            isCorrect = (normUser === normalize(q.en));
            correctDisplay = q.en;
        } else {
            const validAnswers = getValidRussianAnswers(q.ru);
            isCorrect = validAnswers.includes(normUser);
            correctDisplay = q.ru;
        }

        const feedbackEl = document.getElementById('feedback');

        if (isCorrect) {
            score++;
            feedbackEl.textContent = 'Верно!';
            feedbackEl.className = 'feedback success';
        } else {
            feedbackEl.textContent = `Ошибка! Правильно: ${correctDisplay}`;
            feedbackEl.className = 'feedback error';
            mistakes.push({
                question: currentMode === 'ru-en' ? q.ru : q.en,
                correct: correctDisplay,
                yours: userAnswer
            });
        }

        currentIndex++;
        
        setTimeout(() => {
            loadQuestion();
        }, 1500);
    }

    document.getElementById('answer-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            if (document.getElementById('feedback').textContent === '') {
                checkAnswer();
            }
        }
    });

    function showResults() {
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        
        document.getElementById('score-text').textContent = `${score} из ${questions.length}`;
        
        const listEl = document.getElementById('mistakes-list');
        listEl.innerHTML = '';
        
        if (mistakes.length > 0) {
            const title = document.createElement('p');
            title.textContent = 'Ваши ошибки:';
            title.style.fontWeight = 'bold';
            title.style.marginBottom = '10px';
            listEl.appendChild(title);

            mistakes.forEach(m => {
                const div = document.createElement('div');
                div.className = 'result-item';
                div.innerHTML = `
                    <div>Слово: <b>${m.question}</b></div>
                    <div>Вы ввели: <span class="yours">${m.yours}</span></div>
                    <div>Правильно: <span class="correct">${m.correct}</span></div>
                `;
                listEl.appendChild(div);
            });
        } else {
            listEl.innerHTML = '<p style="text-align:center; color: var(--success); font-weight: bold;">Идеальный результат! Ошибок нет.</p>';
        }
    }

    // --- ЛОГИКА ПОДЕЛИТЬСЯ ---
    function shareResult() {
        const siteUrl = window.location.href;
        const resultText = `Я прошел тест на тренажере английских слов и получил результат ${score}/${questions.length}! Попробуй и ты:`;
        const fullText = `${resultText} ${siteUrl}`;

        // Если это мобильный телефон и поддерживается Web Share API
        if (navigator.share) {
            navigator.share({
                title: 'Мой результат в тренажере слов',
                text: resultText,
                url: siteUrl
            }).catch((error) => console.log('Ошибка шаринга:', error));
        } else {
            // Для ПК открываем модальное окно
            document.getElementById('share-modal').classList.add('active');
            
            // Настраиваем ссылки для соцсетей
            const encodedText = encodeURIComponent(fullText);
            document.getElementById('share-tg').href = `https://t.me/share/url?url=${encodeURIComponent(siteUrl)}&text=${encodeURIComponent(resultText)}`;
            document.getElementById('share-wa').href = `https://api.whatsapp.com/send?text=${encodedText}`;
            document.getElementById('share-vk').href = `https://vk.com/share.php?url=${encodeURIComponent(siteUrl)}&title=${encodeURIComponent(resultText)}`;
        }
    }

    function closeModal() {
        document.getElementById('share-modal').classList.remove('active');
    }

    function copyToClipboard() {
        const siteUrl = window.location.href;
        const fullText = `Я прошел тест на тренажере английских слов и получил результат ${score}/${questions.length}! Попробуй и ты: ${siteUrl}`;
        
        navigator.clipboard.writeText(fullText).then(() => {
            const btn = document.getElementById('share-copy');
            const originalText = btn.textContent;
            btn.textContent = '✅ Скопировано!';
            setTimeout(() => { btn.textContent = originalText; }, 2000);
        }).catch(err => {
            alert('Не удалось скопировать текст');
        });
    }

    // Закрытие модального окна по клику вне его
    document.getElementById('share-modal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });
</script>
</body>
</html>
